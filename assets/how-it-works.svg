<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" style="white-space:pre" viewBox="0 0 1536 404" width="100%" role="img" aria-label="A terminal: Alt-A opens AI mode, the user types a request in plain English, presses Enter, a spinner runs, and a shell command replaces the request in the buffer, ready to run" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26">
  <title>zsh-ai-prompt: how it works</title>
  <defs>
    <clipPath id="typed"><rect x="0" y="166" width="0" height="40"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;15.6;31.2;46.8;62.4;78.0;93.6;109.2;124.8;140.4;156.0;171.6;187.2;202.8;218.4;234.0;249.6;265.2;280.8;296.4;312.0;327.6;343.2;358.8;374.4;390.0;405.6;421.2;436.8;452.4;468.0;483.6;499.2;514.8;530.4;546.0;561.6;577.2" keyTimes="0;0.1429;0.1479;0.1529;0.1579;0.1629;0.1679;0.1729;0.1779;0.1829;0.1879;0.1929;0.1979;0.2029;0.2079;0.2129;0.2179;0.2229;0.2279;0.2329;0.2379;0.2429;0.2479;0.2529;0.2579;0.2629;0.2679;0.2729;0.2779;0.2829;0.2879;0.2929;0.2979;0.3029;0.3079;0.3129;0.3179;0.3229"/></rect></clipPath>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2B2640" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- no page background: the window sits on whatever the README renders on -->
  <g transform="translate(96,24)">
    <rect width="1344" height="352" rx="18" fill="#F8F5F1" stroke="#E2DECE" stroke-width="2" filter="url(#soft)"/>
    <circle cx="30" cy="28" r="7" fill="#E2DECE"/>
    <circle cx="54" cy="28" r="7" fill="#E2DECE"/>
    <circle cx="78" cy="28" r="7" fill="#E2DECE"/>

    <g transform="translate(40,0)">
      <!-- powerlevel10k-style two-line prompt -->
      <text x="0" y="104" fill="#0087AF">~/projects/api</text>
      <text x="234.0" y="104" fill="#4E9A06">main</text>
      <text x="0" y="150" fill="#4E9A06" font-weight="700">❯</text>

      <!-- AI mode indicator (PREDISPLAY), between Alt-A and Enter -->
      <g opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1;0.3636"/>
        <text x="34" y="150" fill="#9A94A8">  <tspan fill="#B03A9E">⟡</tspan> AI mode (claude-haiku-5-5) — Enter to send, Esc to cancel</text>
      </g>

      <!-- the request, typed on the line below the indicator -->
      <g opacity="0" clip-path="url(#typed)"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1429;0.3636"/>
        <text x="0" y="196" fill="#4F4D48">find all .log files older than 7 days</text>
      </g>

      <!-- waiting: spinner in the indicator line -->
      <g opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3636;0.4993"/>
        <text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠋<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.10"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠙<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.10;0.20"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠹<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.20;0.30"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠸<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.30;0.40"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠼<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.40;0.50"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠴<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.50;0.60"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠦<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.60;0.70"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠧<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.70;0.80"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠇<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.80;0.90"/></text><text x="65.2" y="152" fill="#B03A9E" font-size="34" opacity="0">⠏<animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.90;1.00"/></text>
        <text x="96.4" y="150" fill="#9A94A8">thinking...</text>
      </g>

      <!-- the answer replaces the buffer, right after the prompt -->
      <g opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4993;0.9571"/>
        <text x="34" y="150" fill="#4F4D48">find . -name &quot;*.log&quot; -type f -mtime +7</text>
      </g>

      <!-- block cursor: moves with the buffer, blinks -->
      <g opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.9571"/>
        <rect width="14" height="30" fill="#4F4D48" opacity="0.8">
          <animate attributeName="x" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="34;0;15.6;31.2;46.8;62.4;78.0;93.6;109.2;124.8;140.4;156.0;171.6;187.2;202.8;218.4;234.0;249.6;265.2;280.8;296.4;312.0;327.6;343.2;358.8;374.4;390.0;405.6;421.2;436.8;452.4;468.0;483.6;499.2;514.8;530.4;546.0;561.6;577.2;0;630.8" keyTimes="0;0.1;0.1429;0.1479;0.1529;0.1579;0.1629;0.1679;0.1729;0.1779;0.1829;0.1879;0.1929;0.1979;0.2029;0.2079;0.2129;0.2179;0.2229;0.2279;0.2329;0.2379;0.2429;0.2479;0.2529;0.2579;0.2629;0.2679;0.2729;0.2779;0.2829;0.2879;0.2929;0.2979;0.3029;0.3079;0.3129;0.3179;0.3229;0.3636;0.4993"/>
          <animate attributeName="y" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="126;172;126" keyTimes="0;0.1;0.4993"/>
          <animate attributeName="opacity" values="0.8;0.8;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- key presses -->
    <g opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0857;0.1643"/>
      <rect x="1192" y="166" width="112" height="46" rx="10" fill="#FFFFFF" stroke="#E2DECE" stroke-width="2"/>
      <rect x="1192" y="206" width="112" height="6" rx="3" fill="#E2DECE"/>
      <text x="1248.0" y="197" fill="#4F4D48" font-size="22" text-anchor="middle">⌥ A</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3636;0.4279"/>
      <rect x="1154" y="166" width="150" height="46" rx="10" fill="#FFFFFF" stroke="#E2DECE" stroke-width="2"/>
      <rect x="1154" y="206" width="150" height="6" rx="3" fill="#E2DECE"/>
      <text x="1229.0" y="197" fill="#4F4D48" font-size="22" text-anchor="middle">⏎ Enter</text>
    </g>
    

    <!-- what is happening, one step at a time -->
    <line x1="40" y1="246" x2="1304" y2="246" stroke="#E2DECE" stroke-width="2"/>
    <g opacity="0" font-size="22"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0857;0.1429"/>
      <circle cx="54" cy="294" r="15" fill="#D97757"/>
      <text x="54" y="301" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">1</text>
      <text x="84" y="302" fill="#4F4D48">Alt-A opens AI mode</text>
    </g>
    <g opacity="0" font-size="22"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1429;0.3636"/>
      <circle cx="54" cy="294" r="15" fill="#D97757"/>
      <text x="54" y="301" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">2</text>
      <text x="84" y="302" fill="#4F4D48">ask for what you want in plain English</text>
    </g>
    <g opacity="0" font-size="22"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3636;0.4993"/>
      <circle cx="54" cy="294" r="15" fill="#D97757"/>
      <text x="54" y="301" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">3</text>
      <text x="84" y="302" fill="#4F4D48">Enter sends it to Claude, OpenAI, Gemini, Grok or Ollama</text>
    </g>
    <g opacity="0" font-size="22"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4993;0.9571"/>
      <circle cx="54" cy="294" r="15" fill="#D97757"/>
      <text x="54" y="301" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">4</text>
      <text x="84" y="302" fill="#4F4D48">the command lands in your buffer: Enter runs it, or edit it first</text>
    </g>
    
  </g>
</svg>
