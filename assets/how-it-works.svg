        <text x="34" y="150" fill="#4F4D48" textLength="592.8" lengthAdjust="spacingAndGlyphs">find . -name &quot;*.log&quot; -type f -mtime +7</text>
      </g>
      <g opacity="1"><animate attributeName="opacity" dur="26.78s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8394;0.8506;0.9664;0.9776;1"/><animateTransform attributeName="transform" type="translate" dur="26.78s" repeatCount="indefinite" values="0 10;0 10;0 0;0 0;0 0;0 10;0 10" keyTimes="0;0.8394;0.8506;0.9664;0.9776;0.978;1"/>
        <text x="34" y="150" fill="#4F4D48" textLength="468.0" lengthAdjust="spacingAndGlyphs">lsof -ti :3000 | xargs kill -9</text>
