        <text x="34" y="150" fill="#B03A9E">⟡</text>
        <text x="66.8" y="150" fill="#9A94A8" textLength="889.2" lengthAdjust="spacingAndGlyphs">AI mode (claude-haiku-5-5) — Enter to send, Esc to cancel</text>
      </g>

      <!-- the request, typed on the line below the indicator -->
      <g opacity="0" clip-path="url(#typed0)"><animate attributeName="opacity" dur="26.78s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.112;0.2599"/>
        <text x="0" y="196" fill="#4F4D48" textLength="577.2" lengthAdjust="spacingAndGlyphs">find all .log files older than 7 days</text>
      </g>
      <g opacity="0" clip-path="url(#typed1)"><animate attributeName="opacity" dur="26.78s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6034;0.7573"/>
        <text x="0" y="196" fill="#4F4D48" textLength="608.4" lengthAdjust="spacingAndGlyphs">kill whatever is listening on port 3000</text>
